before_script:
   - pip install tox

stages:
  - build
  - report

build:
  image: python:$python_version
  parallel:
    matrix:
      - python_version: ["3.11", "3.12", "3.13", "3.14"]
  stage: build
  script:
    - pip install tox
    - tox
  artifacts:
    paths:
      - .coverage*
    expire_in: 5 minutes

coverage:
  image: python:3
  stage: report
  script:
    - tox -e report
  coverage: '/TOTAL.*\s+(\d+\.\d+%)$/'
  artifacts:
    paths:
      - htmlcov
    expire_in: 1 week
