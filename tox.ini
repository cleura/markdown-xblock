[tox]
envlist = py{311,312,313,314}{,-pipdeptree,-pipdeptree-requirements,-flake8}
skip_missing_interpreters = true

[gh-actions]
python =
    3.11: py311{,-pipdeptree,-pipdeptree-requirements,-flake8}
    3.12: py312{,-pipdeptree,-pipdeptree-requirements,-flake8}
    3.13: py313{,-pipdeptree,-pipdeptree-requirements,-flake8}
    3.14: py314{,-pipdeptree,-pipdeptree-requirements,-flake8}

[flake8]
ignore = E124
max-line-length = 120

[coverage:run]
parallel = True
source =
       tests
       markdown_xblock

[coverage:report]
precision = 2

[testenv]
commands = coverage run manage.py test
passenv = DJANGO_*
deps =
    -rrequirements/base.txt
    -rrequirements/test.txt

[testenv:build]
skip_install = true
description = "Build dist package"
deps =
     build
     twine
commands =
    python -m build

[testenv:py{311,312,313,314}-pipdeptree]
deps =
    pipdeptree
commands = pipdeptree -w fail

[testenv:py{311,312,313,314}-pipdeptree-requirements]
deps =
     -rrequirements/base.txt
    pipdeptree
commands = pipdeptree -w fail

[testenv:py{311,312,313,314}-flake8]
deps = flake8
commands = flake8

[testenv:report]
deps = coverage
skip_install = true
commands =
    coverage combine
    coverage report
    coverage html

[testenv:bumpversion]
skip_install = True
passenv =
  # Git can only find its global configuration if it knows where the
  # user's HOME is.
  HOME
  # We set sign_tags in .bumpversion.cfg, so pass in the GnuPG agent
  # reference to avoid having to retype the passphrase for an
  # already-cached private key.
  GPG_AGENT_INFO
deps = bump2version
commands = bump2version {posargs}
